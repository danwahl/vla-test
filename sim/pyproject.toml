[project]
name = "vla-test-sim"
version = "0.1.0"
description = "SO-101 block manipulation in ManiSkill3."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mani-skill==3.0.1",
    "sapien==3.0.3",
    "torch==2.11.0",
    "numpy>=2.0,<2.3",
    "gymnasium>=1.0,<2",
    "lerobot[dataset]==0.6.0",
    # Bump with torch: a torchao release is built for one minor version of it.
    "torchao==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]
