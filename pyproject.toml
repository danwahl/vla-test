# One lockfile across both environments, so the checkpoint `train` produces loads under the
# same torch and lerobot that `sim` evaluates it with.
[tool.uv.workspace]
members = ["sim", "train", "rl", "hw"]

[tool.uv.sources]
# LaWAM landed after 0.6.1, so lerobot comes from a commit rather than a release. Pinned,
# since `main` moves under us. One source at the root: the workspace shares a lockfile.
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "5aa74557f84c54d4b458f8b9643c5aa2982acfed" }
# The same index that revision of lerobot selects, named here so the CUDA build the lock
# resolves to is this workspace's choice and survives a move to another revision.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["sim/tests", "rl/tests", "hw/tests"]
# `hw` is imported from the repo root, so its tests need the root the same way
# `python -m hw.<script>` gives it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Where the first-party packages live, for import sorting.
src = ["sim/src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
