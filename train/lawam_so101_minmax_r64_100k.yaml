# `lawam_so101_minmax_r64.yaml` on twice the budget, with the cosine stretched to match.
# The 50k curve is still climbing at its last point, and the schedule anneals to zero at
# `scheduler_decay_steps`, so that point sits at the end of a decay rather than on a
# plateau. This file reads past it; the curve it gives peaks at 123 against that 125.
# Everything but the budget is matched: pi0.5 is trained out in 20k steps, so the
# comparison is read as an equal-task one rather than an equal-compute one. Stock
# lerobot-train runs this file as it stands:
#
#   uv run lerobot-train --config_path=train/lawam_so101_minmax_r64_100k.yaml \
#                        --output_dir=... --job_name=...
#
# LaWAM's world model sits in the action path rather than beside it: the LAM decoder
# predicts the next latent and the flow head reads that prediction. There is no arm to
# switch it off, so the control this policy is read against is VLA-JEPA's pair.

# Values under `policy:` reach the pretrained config as flattened CLI overrides, and that
# flattener drops anything that is null or a list. Settings below that are either are
# written as JSON strings so they survive it.
policy:
  path: jialei02/lawam-pretrain-lerobot
  push_to_hub: false
  # pi0.5's schedule shape on this budget: 1000 warmup steps, cosine over the run.
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 100000
  # What the checkpoint ships and the released SFT keeps. `sim/src/sim/dataset.py` stamps
  # q01/q99 to the arm's travel and leaves min/max as the data wrote them, so this is a
  # narrower window than the matched recipe reads and not the same one relabelled.
  normalization_mapping: '{"VISUAL": "IDENTITY", "STATE": "MIN_MAX", "ACTION": "MIN_MAX"}'
  # Their SFT sets this and the checkpoint default is false. It clamps the normalized action
  # on the way out, which under MIN_MAX is the range assertion it is meant to be.
  clip_normalized_actions: true
  # Action and state are padded to 32 and masked, so the arm's 6 dimensions need no layer
  # re-drawn and `reinit_modules` has nothing to name.

dataset:
  repo_id: drwahl/so101_block_stack
  # Where sim/scripts/combine.py wrote it, with the hardware episodes repeated: the repeat
  # count there is what sets how much of a batch comes off the arm.
  root: /data/datasets/so101_block_stack
  # Contrast and saturation are what a change of lighting moves. Both lenses expose
  # themselves and hold the frame mean across that change, so brightness is the axis that
  # moves least. Hue stays well inside the separation between the three colours the prompt
  # names.
  #
  # Where a camera points is left alone. The top camera is bolted to the arm's own base, so
  # where a block sits in its frame is what says where the block is.
  image_transforms:
    enable: true
    max_num_transforms: 3
    tfs:
      brightness:
        type: ColorJitter
        kwargs: {brightness: [0.85, 1.2]}
      contrast:
        type: ColorJitter
        kwargs: {contrast: [0.6, 1.7]}
      saturation:
        type: ColorJitter
        kwargs: {saturation: [0.5, 2.0]}
      hue:
        type: ColorJitter
        kwargs: {hue: [-0.035, 0.035]}

# The same split the other two take: an adapter over the language backbone, the action head
# trained outright, the vision towers left alone. The LAM decoder joins the head because it
# is the world model, and the bridge between them is 146k parameters.
peft:
  method_type: LORA
  r: 64
  lora_alpha: 128
  target_modules: '.*\.vlm\.model\.language_model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)'
  full_training_modules:
    - policy_backend.flow
    - policy_backend.vlm_to_lam
    - policy_backend.lam.decoder

# The checkpoint names its two cameras by role. The top camera is the one that carries where
# a block is, so it takes the primary slot the LAM also reads.
rename_map:
  observation.images.top: observation.images.image
  observation.images.wrist: observation.images.image2

steps: 100000
batch_size: 4
save_freq: 5000

wandb:
  enable: true
  project: vla-test
  disable_artifact: true
