# pi0.5 fine-tuned on the hardware demonstrations alone, with no sim pretraining, as the
# control for `train/pi05_so101_hw.yaml`. Everything else about the two runs matches, so
# what separates them is where the weights came from. Stock lerobot-train runs this file as
# it stands:
#
#   uv run lerobot-train --config_path=train/pi05_so101_hw_base.yaml \
#                        --output_dir=... --job_name=...

policy:
  path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  gradient_checkpointing: true
  scheduler_decay_steps: 5000

dataset:
  repo_id: vla-test/so101_block_stack_hw
  # Where hw/oracle_replay.py wrote it.
  root: /data/datasets/so101_block_stack_hw

peft:
  method_type: LORA
  r: 32
  lora_alpha: 64
  target_modules: '.*\.paligemma\.model\.language_model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)'
  full_training_modules:
    - gemma_expert.model
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out

rename_map:
  observation.images.top: observation.images.base_0_rgb
  observation.images.wrist: observation.images.left_wrist_0_rgb

steps: 5000
batch_size: 4
save_freq: 1000

wandb:
  enable: true
  project: vla-test
  disable_artifact: true
