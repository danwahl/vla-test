# pi0.5 fine-tuned on the sim and hardware demonstrations together, at the recipe and the
# budget `train/pi05_so101_lora_backbone.yaml` uses, so its sim score is read against that
# run's. Stock lerobot-train runs this file as it stands:
#
#   uv run lerobot-train --config_path=train/pi05_so101_mix.yaml \
#                        --output_dir=... --job_name=...

policy:
  path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  gradient_checkpointing: true
  scheduler_decay_steps: 20000

dataset:
  repo_id: vla-test/so101_block_stack_mix
  # Where sim/scripts/combine.py wrote it, with the hardware episodes repeated: the repeat
  # count there is what sets how much of a batch comes off the arm.
  root: /data/datasets/so101_block_stack_mix

peft:
  method_type: LORA
  r: 32
  lora_alpha: 64
  target_modules: '.*\.paligemma\.model\.language_model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)'
  full_training_modules:
    - gemma_expert.model
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out

rename_map:
  observation.images.top: observation.images.base_0_rgb
  observation.images.wrist: observation.images.left_wrist_0_rgb

steps: 20000
batch_size: 4
save_freq: 5000

wandb:
  enable: true
  project: vla-test
  disable_artifact: true
