# VLA-JEPA on the normalization its own checkpoint ships: STATE mean/std, ACTION min/max
# over the range the dataset covers. The matched recipe overrides both to QUANTILES, and
# that override carries the clip with it: the factory adds `ClipActionsProcessorStep` only
# when ACTION is spelled MIN_MAX, so `clip_normalized_actions: true` reaches a run only
# under this file. The same pair moved LaWAM by 38 layouts and moves this policy by none,
# which is what `reinit_modules` predicts: the layers our 6 dimensions land in are re-drawn
# here and merely padded there, so a borrowed window is a free parameter rather than a
# distribution shift. Everything else is `vla_jepa_so101_mix.yaml`, whose header follows.
#
# The pi0.5 mix recipe, held as close to itself as the two architectures allow. Everything
# but the budget is matched: pi0.5 is trained out in 20k steps and this policy is still
# climbing there, so it gets 50k and the comparison is read as an equal-task one rather than
# an equal-compute one. Stock lerobot-train runs this file as it stands:
#
#   uv run lerobot-train --config_path=train/vla_jepa_so101_minmax.yaml \
#                        --output_dir=... --job_name=...
#
# The world model is what is under test, so the control arm is this same file with the
# auxiliary loss switched off:
#
#   ... --policy.path=lerobot/VLA-JEPA-Pretrain --policy.enable_world_model=false
#
# A `policy.` override on the command line replaces this file's policy block rather than
# merging into it, so the path has to be repeated or draccus cannot resolve the type.

# Values under `policy:` reach the pretrained config as flattened CLI overrides, and that
# flattener drops anything that is null or a list. The two settings below that are either
# are written as JSON strings so they survive it.
policy:
  path: lerobot/VLA-JEPA-Pretrain
  push_to_hub: false
  torch_dtype: bfloat16
  # pi0.5's schedule shape on this budget: 1000 warmup steps, cosine over the run.
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 50000
  # The checkpoint's own defaults. `sim/src/sim/dataset.py` stamps q01/q99 to the arm's
  # travel and leaves min/max and the moments as the data wrote them, so this is a narrower
  # window than the matched recipe reads. The projections that consume it are reinitialised
  # below either way.
  normalization_mapping: '{"VISUAL": "IDENTITY", "STATE": "MEAN_STD", "ACTION": "MIN_MAX"}'
  # DROID is 7 action and 8 state dimensions; the arm is 6 of each. Only the layers that
  # touch those two widths are re-drawn, and the rest of each projection is kept.
  reinit_modules: '["model.action_model.action_encoder", "model.action_model.action_decoder", "model.action_model.state_encoder"]'
  # LIBERO's gripper is a sign; ours is a jaw width the unnormalizer already produces.
  pre_snap_gripper_action: false
  binarize_gripper_action: false
  # Applied on the inference path only, so anything but null trains and deploys at
  # different resolutions. Both processors resize on their own.
  resize_images_to: 'null'

dataset:
  repo_id: drwahl/so101_block_stack
  # Where sim/scripts/combine.py wrote it, with the hardware episodes repeated: the repeat
  # count there is what sets how much of a batch comes off the arm.
  root: /data/datasets/so101_block_stack
  # Contrast and saturation are what a change of lighting moves. Both lenses expose
  # themselves and hold the frame mean across that change, so brightness is the axis that
  # moves least. Hue stays well inside the separation between the three colours the prompt
  # names.
  #
  # Where a camera points is left alone. The top camera is bolted to the arm's own base, so
  # where a block sits in its frame is what says where the block is.
  image_transforms:
    enable: true
    max_num_transforms: 3
    tfs:
      brightness:
        type: ColorJitter
        kwargs: {brightness: [0.85, 1.2]}
      contrast:
        type: ColorJitter
        kwargs: {contrast: [0.6, 1.7]}
      saturation:
        type: ColorJitter
        kwargs: {saturation: [0.5, 2.0]}
      hue:
        type: ColorJitter
        kwargs: {hue: [-0.035, 0.035]}

# The same split pi0.5 takes: an adapter over the language backbone, the action head
# trained outright, the vision towers left alone. The video predictor joins the head
# because the auxiliary loss is the only thing that trains it.
peft:
  method_type: LORA
  r: 32
  lora_alpha: 64
  target_modules: '.*\.qwen\.model\.model\.language_model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)'
  full_training_modules:
    - action_model
    - video_predictor

# The checkpoint was pretrained on two DROID exterior views. The top camera is the one that
# carries where a block is, so it takes the first slot.
rename_map:
  observation.images.top: observation.images.exterior_1_left
  observation.images.wrist: observation.images.exterior_2_left

steps: 50000
# Batch 4 peaks at 22.5 GiB of the 4090's 24, so the card carries nothing else during a
# run. num_video_frames: 4 is the lever if it ever stops fitting.
batch_size: 4
save_freq: 5000

wandb:
  enable: true
  project: vla-test
  disable_artifact: true
