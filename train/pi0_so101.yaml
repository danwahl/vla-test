# pi0 on the block-stack demonstrations, on the protocol `pi05_so101_lora_backbone.yaml`
# sets: the same data, 20k steps at batch 4, r=32 LoRA on the language backbone, the action
# expert trained outright, vision frozen, no augmentation. What the checkpoint was
# pretrained under stays its own: normalization, optimizer and chunk length. Stock
# lerobot-train runs this file as it stands:
#
#   uv run lerobot-train --config_path=train/pi0_so101.yaml \
#                        --output_dir=... --job_name=...

policy:
  path: lerobot/pi0_base
  push_to_hub: false
  # pi0_base publishes float32; pi0.5 trains in bfloat16 and the run fits only that way.
  dtype: bfloat16
  gradient_checkpointing: true
  # pi0.5's schedule: 1000 warmup steps, then cosine to `steps`. The learning rate it
  # peaks at and decays to is the checkpoint's.
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 20000
  # pi0_base publishes no normalization mapping, so it reads PI0Config's MEAN_STD.

dataset:
  repo_id: drwahl/so101_block_stack_sim
  root: /data/datasets/so101_block_stack_sim

# pi0.5's split, with the state projection pi0 keeps where pi0.5 tokenizes the state.
# Matched by bare endswith, so `gemma_expert.model` leaves out the expert's dead lm_head.
peft:
  method_type: LORA
  r: 32
  lora_alpha: 64
  target_modules: '.*\.paligemma\.model\.language_model\.layers\.\d+\.(self_attn\.[qkvo]_proj|mlp\.(gate|up|down)_proj)'
  full_training_modules:
    - gemma_expert.model
    - state_proj
    - action_in_proj
    - action_out_proj
    - action_time_mlp_in
    - action_time_mlp_out

rename_map:
  observation.images.top: observation.images.base_0_rgb
  observation.images.wrist: observation.images.left_wrist_0_rgb

steps: 20000
batch_size: 4
save_freq: 5000

trackio:
  enable: true
  project: vla-test
